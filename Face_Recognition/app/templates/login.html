{% extends 'base.html' %}
{% block content %}
<h1>Login Admin</h1>
<p class="muted">Login diperlukan untuk menambah siswa dan export laporan.</p>

<form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="post" class="card"
  style="max-width:520px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div style="margin-bottom: 12px;">
    <label for="username" style="display:block; font-weight:700; margin-bottom:6px;">Username</label>
    <input id="username" name="username" type="text" required style="width:100%;" placeholder="admin" autofocus />
  </div>
  <div>
    <label for="password" style="display:block; font-weight:700; margin-bottom:6px;">Password</label>
    <input id="password" name="password" type="password" required style="width:100%;" />
  </div>
  <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
    <button class="btn" type="submit">Login</button>
    <a href="{{ url_for('main.index') }}" class="muted" style="text-decoration:none;">Kembali</a>
  </div>
</form>
{% endblock %}
