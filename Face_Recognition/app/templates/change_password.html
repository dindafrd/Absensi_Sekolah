{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2 style="margin-bottom: 1.5rem; color: var(--accent);">Ubah Password</h2>
  
  <form method="POST" action="{{ url_for('auth.change_password') }}" id="changePasswordForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="input-group">
      <label for="current_password">Password Saat Ini</label>
      <input type="password" id="current_password" name="current_password" required 
             style="width: 100%;">
    </div>

    <div class="input-group">
      <label for="new_password">Password Baru</label>
      <input type="password" id="new_password" name="new_password" required 
             style="width: 100%;" oninput="validatePassword()">
      <small id="passwordStrength" style="color: var(--text-muted);"></small>
    </div>

    <div class="input-group">
      <label for="confirm_password">Konfirmasi Password Baru</label>
      <input type="password" id="confirm_password" name="confirm_password" required 
             style="width: 100%;" oninput="validatePassword()">
      <small id="passwordMatch" style="color: var(--text-muted);"></small>
    </div>

    <div class="card" style="background: rgba(56, 189, 248, 0.05); margin-bottom: 1.5rem;">
      <h4 style="margin-bottom: 0.75rem; color: var(--accent); font-size: 0.875rem;">Persyaratan Password:</h4>
      <ul id="requirementsList" style="list-style: none; padding: 0; margin: 0; font-size: 0.875rem;">
        {% for req in requirements %}
        <li style="padding: 0.25rem 0; color: var(--text-muted);" class="requirement" data-valid="false">
          <span class="icon">○</span> {{ req }}
        </li>
        {% endfor %}
      </ul>
    </div>

    <div style="display: flex; gap: 1rem;">
      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
        Ubah Password
      </button>
      <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Batal</a>
    </div>
  </form>
</div>

<script>
function validatePassword() {
  const newPassword = document.getElementById('new_password').value;
  const confirmPassword = document.getElementById('confirm_password').value;
  const strengthText = document.getElementById('passwordStrength');
  const matchText = document.getElementById('passwordMatch');
  const submitBtn = document.getElementById('submitBtn');
  
  // Check password match
  if (confirmPassword) {
    if (newPassword === confirmPassword) {
      matchText.textContent = '✓ Password cocok';
      matchText.style.color = 'var(--success)';
    } else {
      matchText.textContent = '✗ Password tidak cocok';
      matchText.style.color = 'var(--danger)';
    }
  } else {
    matchText.textContent = '';
  }
  
  // Validate strength
  const validations = [
    { test: (p) => p.length >= 8, desc: 'Minimal 8 karakter' },
    { test: (p) => /[A-Z]/.test(p), desc: 'Huruf besar' },
    { test: (p) => /[a-z]/.test(p), desc: 'Huruf kecil' },
    { test: (p) => /\d/.test(p), desc: 'Angka' },
  ];
  
  let validCount = 0;
  validations.forEach((v, i) => {
    const element = document.querySelectorAll('.requirement')[i];
    if (v.test(newPassword)) {
      element.setAttribute('data-valid', 'true');
      element.querySelector('.icon').textContent = '✓';
      element.style.color = 'var(--success)';
      validCount++;
    } else {
      element.setAttribute('data-valid', 'false');
      element.querySelector('.icon').textContent = '○';
      element.style.color = 'var(--text-muted)';
    }
  });
  
  // Update strength indicator
  if (newPassword.length === 0) {
    strengthText.textContent = '';
  } else if (validCount === validations.length) {
    strengthText.textContent = '✓ Password kuat';
    strengthText.style.color = 'var(--success)';
  } else {
    strengthText.textContent = `${validCount}/${validations.length} persyaratan terpenuhi`;
    strengthText.style.color = validCount >= 2 ? 'var(--warning)' : 'var(--danger)';
  }
  
  // Enable/disable submit button
  const allValid = validCount === validations.length;
  const match = newPassword === confirmPassword && newPassword.length > 0;
  submitBtn.disabled = !(allValid && match);
}
</script>
{% endblock %}
